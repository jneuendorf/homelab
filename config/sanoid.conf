# /etc/sanoid/sanoid.conf — automatic ZFS snapshots of the bulk dataset, rolling window + auto-prune.
# NOTE: sanoid.conf takes NO trailing comments — every # must be on its own line.
# The base defaults load automatically from /usr/share/sanoid/sanoid.defaults.conf (don't edit that).

[rpool/bulk]
    # pull the retention/settings from the [template_production] block below
    use_template = production
    # snapshot rpool/bulk AND its children (photos, docs) in one atomic pass
    recursive = yes

[template_production]
    # keep the last 24 hourly snapshots
    hourly = 24
    # keep the last 30 daily snapshots
    daily = 30
    # keep the last 3 monthly snapshots
    monthly = 3
    # actually take the snapshots on schedule (not just prune)
    autosnap = yes
    # delete snapshots older than the retention counts above
    autoprune = yes
